<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Workshop17 Reception | Create @ Studio17</title>
<style>
:root{--bg:#f5f6f4;--card:#fff;--ink:#172019;--muted:#6d786f;--line:#dfe5df;--accent:#173d2d;--dark:#10261b;--soft:#eaf0ec;--warn:#8a5b00;--warnbg:#fff5d9;--danger:#9c2e2e}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--dark);color:#fff;padding:22px 26px;position:sticky;top:0;z-index:5}
.wrap{max-width:1180px;margin:auto}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;opacity:.7}
.title{font-size:25px;font-weight:780;margin-top:4px}
main{padding:24px 18px 48px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 7px 22px rgba(20,32,25,.04)}
.panel h1,.panel h2{margin:0 0 8px}
.muted{color:var(--muted)}
.hidden{display:none!important}
.gate{position:fixed;inset:0;background:rgba(16,38,27,.97);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.gatebox{background:#fff;border-radius:22px;width:min(430px,100%);padding:28px}
input,select{width:100%;margin-top:6px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:white}
button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:10px 15px;font-weight:700;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.error{color:var(--danger);margin-top:10px;font-size:13px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:16px 0}
.toolbar label{min-width:260px;flex:1;font-size:12px;color:var(--muted);font-weight:700}
.toolbar .small{max-width:220px}
.group{margin:22px 0}
.group h3{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
.list{display:grid;gap:10px}
.item{border:1px solid var(--line);border-radius:15px;padding:15px;background:#fff;display:grid;grid-template-columns:120px 1fr auto;gap:16px;align-items:start}
.time{font-size:19px;font-weight:800}
.client{font-size:17px;font-weight:800}
.meta{margin-top:5px;color:var(--muted);font-size:13px;line-height:1.55}
.note{margin-top:8px;padding:8px 10px;background:var(--soft);border-radius:9px;font-size:13px}
.pill{display:inline-block;padding:5px 9px;border-radius:999px;font-size:11px;text-transform:capitalize}
.confirmed{background:#e6f2e9;color:#245d32}
.provisional{background:var(--warnbg);color:var(--warn)}
.toprow{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.logout{font-size:12px;padding:8px 12px}
@media(max-width:700px){.item{grid-template-columns:1fr}.time{font-size:16px}}
</style>
</head>
<body>
<div id="gate" class="gate">
  <div class="gatebox">
    <div class="eyebrow" style="color:#617066">CREATE @ STUDIO17</div>
    <h1>Workshop17 Reception</h1>
    <p class="muted">Enter the Workshop17 reception PIN.</p>
    <input id="pin" type="password" placeholder="Reception PIN" autocomplete="current-password">
    <button class="primary" style="width:100%;margin-top:12px" onclick="unlock()">Open reception diary</button>
    <div id="gateError" class="error"></div>
  </div>
</div>

<header>
  <div class="wrap">
    <div class="eyebrow">CREATE @ STUDIO17</div>
    <div class="title">Workshop17 Reception</div>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="panel">
      <div class="toprow">
        <div>
          <h2>Studio arrivals & bookings</h2>
          <p class="muted">Reception view only. Commercial, invoicing and Urban Motion internal information is not available here.</p>
        </div>
        <button class="logout" onclick="logout()">Log out</button>
      </div>

      <div class="toolbar">
        <label>Search bookings
          <input id="search" placeholder="Search client, contact, booking ref or production type" oninput="render()">
        </label>
        <label class="small">Show
          <select id="filter" onchange="render()">
            <option value="active">Confirmed & provisional</option>
            <option value="all">All non-cancelled</option>
          </select>
        </label>
      </div>
      <div id="content"><p class="muted">Loading bookings…</p></div>
    </div>
  </div>
</main>

<script>
const API='https://khilxndzfgwjxcyhlhbw.supabase.co/functions/v1/studio17-reception-api';
let PIN=sessionStorage.getItem('st17w17pin')||'';
let bookings=[];

function esc(v){
  return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function localISO(d){
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
async function api(){
  const r=await fetch(API,{headers:{'x-studio-pin':PIN}});
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error||'Unable to load reception diary');
  return d;
}
async function unlock(){
  PIN=document.getElementById('pin').value.trim();
  document.getElementById('gateError').textContent='';
  try{
    const d=await api();
    bookings=d.bookings||[];
    sessionStorage.setItem('st17w17pin',PIN);
    document.getElementById('gate').classList.add('hidden');
    render();
  }catch(e){
    document.getElementById('gateError').textContent=e.message==='Invalid reception PIN'?'Incorrect reception PIN.':'Unable to load reception diary. Please try again.';
  }
}
function logout(){
  sessionStorage.removeItem('st17w17pin');
  PIN='';
  location.reload();
}
function render(){
  const box=document.getElementById('content');
  const q=(document.getElementById('search')?.value||'').trim().toLowerCase();
  const mode=document.getElementById('filter')?.value||'active';

  const today=new Date();today.setHours(0,0,0,0);
  const tomorrow=new Date(today);tomorrow.setDate(tomorrow.getDate()+1);
  const todayIso=localISO(today),tomorrowIso=localISO(tomorrow);

  let rows=bookings.filter(b=>b.status!=='cancelled');
  if(mode==='active') rows=rows.filter(b=>['confirmed','provisional'].includes(b.status));
  if(q) rows=rows.filter(b=>[b.client_company,b.contact_name,b.booking_ref,b.booking_type,b.operations_notes].some(v=>String(v||'').toLowerCase().includes(q)));
  rows.sort((a,b)=>(a.booking_date+a.start_time).localeCompare(b.booking_date+b.start_time));

  const groups=[
    ['Today',rows.filter(b=>b.booking_date===todayIso)],
    ['Tomorrow',rows.filter(b=>b.booking_date===tomorrowIso)],
    ['Upcoming',rows.filter(b=>b.booking_date>tomorrowIso)]
  ];

  const card=b=>{
    const setup=Number(b.setup_minutes||0);
    let arrival='';
    if(setup&&b.start_time){
      const [h,m]=b.start_time.split(':').map(Number);
      const mins=h*60+m-setup;
      arrival=String(Math.floor((mins+1440)%1440/60)).padStart(2,'0')+':'+String((mins+1440)%60).padStart(2,'0');
    }
    const cls=b.status==='confirmed'?'confirmed':'provisional';
    return `<div class="item">
      <div>
        <div class="time">${esc(b.start_time?.slice(0,5))}–${esc(b.end_time?.slice(0,5))}</div>
        <div class="muted">${esc(b.booking_ref)}</div>
      </div>
      <div>
        <div class="client">${esc(b.client_company)}</div>
        <div class="meta"><b>${esc(b.booking_type)}</b> · ${esc(b.guest_count||0)} guest${Number(b.guest_count)===1?'':'s'}${b.contact_name?' · Contact: '+esc(b.contact_name):''}${arrival?' · Arrival/setup: '+esc(arrival):''}</div>
        ${b.operations_notes?`<div class="note"><b>Reception / operations:</b> ${esc(b.operations_notes)}</div>`:''}
      </div>
      <div><span class="pill ${cls}">${esc(b.status)}</span></div>
    </div>`;
  };

  box.innerHTML=groups.map(([name,list])=>`<div class="group">
    <h3>${name}${list.length?' · '+list.length:''}</h3>
    ${list.length?`<div class="list">${list.map(card).join('')}</div>`:`<p class="muted">No ${name.toLowerCase()} bookings.</p>`}
  </div>`).join('');
}

if(PIN){
  api().then(d=>{
    bookings=d.bookings||[];
    document.getElementById('gate').classList.add('hidden');
    render();
  }).catch(()=>{
    sessionStorage.removeItem('st17w17pin');
    PIN='';
  });
}
</script>
</body>
</html>
